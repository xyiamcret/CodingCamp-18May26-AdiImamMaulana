<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-container">

    <!-- ── TOP BAR ── -->
    <header class="top-bar">
      <h1 class="app-title">Life Dashboard</h1>
      <div class="top-bar-actions">
        <button class="btn btn-ghost" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
        <button class="btn btn-ghost" id="settings-btn" aria-label="Open settings" title="Settings">⚙️</button>
      </div>
    </header>

    <!-- ── GREETING SECTION ── -->
    <section class="card greeting-card" aria-label="Greeting">
      <div class="greeting-time" id="greeting-time">00:00:00</div>
      <div class="greeting-date" id="greeting-date">Monday, 1 January 2025</div>
      <div class="greeting-text" id="greeting-text">Good morning! 👋</div>
    </section>

    <!-- ── SETTINGS MODAL ── -->
    <div class="modal-overlay" id="settings-modal" hidden aria-modal="true" role="dialog" aria-label="Settings">
      <div class="modal">
        <div class="modal-header">
          <h2>Settings</h2>
          <button class="btn btn-ghost" id="settings-close" aria-label="Close settings">✕</button>
        </div>
        <div class="modal-body">
          <label class="form-label" for="input-name">Your Name</label>
          <div class="input-row">
            <input type="text" id="input-name" class="form-input" placeholder="Enter your name…" autocomplete="off" />
            <button class="btn btn-primary" id="save-name-btn">Save</button>
          </div>
          <label class="form-label" for="input-pomodoro">Pomodoro Duration (minutes)</label>
          <div class="input-row">
            <input type="number" id="input-pomodoro" class="form-input" min="1" max="120" value="25" />
            <button class="btn btn-primary" id="save-pomodoro-btn">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ── FOCUS TIMER ── -->
    <section class="card timer-card" aria-label="Focus timer">
      <h2 class="section-title">🍅 Focus Timer</h2>
      <div class="timer-display" id="timer-display" aria-live="polite">25:00</div>
      <div class="timer-controls">
        <button class="btn btn-primary" id="timer-start">Start</button>
        <button class="btn btn-secondary" id="timer-stop">Stop</button>
        <button class="btn btn-ghost-border" id="timer-reset">Reset</button>
      </div>
    </section>

    <!-- ── TO-DO LIST ── -->
    <section class="card todo-card" aria-label="To-do list">
      <h2 class="section-title">📝 To-Do List</h2>

      <!-- Summary -->
      <div class="summary-counts">
        <div class="count-card">
          <span class="count-number" id="count-total">0</span>
          <span class="count-label">Total</span>
        </div>
        <div class="count-card">
          <span class="count-number" id="count-active">0</span>
          <span class="count-label">Active</span>
        </div>
        <div class="count-card">
          <span class="count-number" id="count-done">0</span>
          <span class="count-label">Done</span>
        </div>
      </div>
      <div class="progress-bar-container" aria-label="Task progress">
        <div class="progress-bar" id="progress-bar" role="progressbar"
             aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
      </div>

      <!-- Add task -->
      <form id="add-task-form" class="input-row" style="margin-top: 12px;">
        <input type="text" id="task-input" class="form-input" placeholder="Add a new task…" autocomplete="off" aria-label="New task title" />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>

      <!-- Filters -->
      <nav class="filter-nav" aria-label="Task filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
        <button class="btn btn-danger btn-sm" id="clear-completed-btn" hidden>Clear Done</button>
      </nav>

      <!-- Task list -->
      <ul class="task-list" id="task-list" aria-label="Task list" aria-live="polite"></ul>
      <p class="empty-state" id="empty-state">No tasks yet. Add one above!</p>
    </section>

    <!-- ── QUICK LINKS ── -->
    <section class="card links-card" aria-label="Quick links">
      <h2 class="section-title">🔗 Quick Links</h2>
      <form id="add-link-form" class="input-row">
        <input type="text" id="link-name-input" class="form-input" placeholder="Label (e.g. GitHub)" autocomplete="off" aria-label="Link label" />
        <input type="url" id="link-url-input" class="form-input" placeholder="https://…" autocomplete="off" aria-label="Link URL" />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
      <div class="links-grid" id="links-grid" aria-label="Saved links"></div>
      <p class="empty-state" id="links-empty">No links yet. Add one above!</p>
    </section>

  </div><!-- /.app-container -->

  <script src="js/script.js"></script>
</body>
</html>
